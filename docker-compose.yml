# NetCore TAC ETA — API + web UI.   Run with: make start   (or: docker compose up --build -d --wait)
# Prerequisite: uv run python scripts/train_model.py  (the model is baked into the API image)
# Browser -> web (NGINX, host port ${WEB_PORT:-80}) -> /api, /docs, /openapi.json -> eta-api:8000 (internal only)
services:
  eta-api:
    build: .
    image: netcore-tac-eta-api:0.5.0
    env_file:
      - path: .env
        required: false          # copy .env.example to .env to customise
    environment:
      HOST: 0.0.0.0              # fixed inside the container
      PORT: "8000"
      TRUST_PROXY_HEADERS: "true"   # NGINX overwrites X-Forwarded-For with the real client IP
    expose:
      - "8000"                   # reachable by the web service only; not published to the host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      start_interval: 2s         # check every 2 s while starting, so `make start` returns quickly
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 512m

  web:
    build:
      context: .
      dockerfile: web/Dockerfile   # context allow-list: web/Dockerfile.dockerignore
    image: netcore-tac-eta-web:0.5.0
    ports:
      - "${WEB_PORT:-80}:8080"
    depends_on:
      eta-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      start_interval: 2s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 128m
