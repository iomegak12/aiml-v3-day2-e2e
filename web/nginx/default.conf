# NetCore TAC ETA — static web UI + same-origin reverse proxy to the API.
# Included in the http {} block of nginx-unprivileged (runs as UID 101, listens on 8080).

# Strict CSP everywhere; Swagger UI (/docs) needs inline script and the jsDelivr CDN.
map $uri $content_security_policy {
    default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    /docs   "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript text/markdown;
    client_max_body_size 16k;

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/problem+json text/markdown;

    # Docker's embedded DNS; a variable upstream is resolved per request, so NGINX starts
    # even when the API is down and follows the API container's IP when it is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://eta-api:8000;

    # ---------- Container healthcheck ----------
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # ---------- API (same origin; CORS stays disabled) ----------
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $api_upstream;
        error_page 502 504 = @api_down;
    }

    location = /docs {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $api_upstream;
        error_page 502 504 = @api_down;
    }

    location = /openapi.json {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $api_upstream;
        error_page 502 504 = @api_down;
    }

    # API unreachable (stopped, restarting, timed out): RFC 9457 problem, like the API's own errors
    location @api_down {
        default_type application/problem+json;
        include /etc/nginx/snippets/security-headers.conf;
        return 502 '{"type":"https://netcore.example/problems/api-unavailable","title":"API unavailable","status":502,"detail":"The prediction service is not reachable. Try again shortly."}';
    }

    # ---------- Static site ----------
    location = /README.md {
        types { }
        default_type text/markdown;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
