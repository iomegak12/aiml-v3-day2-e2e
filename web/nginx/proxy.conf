# Proxy settings for the API locations.
proxy_http_version 1.1;
proxy_set_header Host $host;
# Overwrite (never append) X-Forwarded-For with the real client IP, so clients cannot spoof it.
# eta-api runs with TRUST_PROXY_HEADERS=true and rate-limits on this value.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_connect_timeout 3s;
proxy_send_timeout 15s;
proxy_read_timeout 15s;
# Pass the API's own problem+json errors (422, 429, 503, …) through unchanged
proxy_intercept_errors off;
