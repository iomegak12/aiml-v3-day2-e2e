[project]
name = "day2"
version = "0.4.0"
description = "NetCore TAC Desk: resolution-time ML workflow and ETA REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "joblib>=1.6.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pydantic-settings>=2.16.3",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]
notebook = [
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.8.0,<1.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "netcore_tac"

[tool.uv]
default-groups = ["dev", "notebook"]
